; MeshDeck OS - custom standalone MeshCore firmware for LilyGo T-Deck
; This file is copied into the MeshCore checkout as platformio.local.ini
; (it is picked up automatically via extra_configs)

[env:MeshCore_Enhanced_TDeck_Plus]
extends = LilyGo_TDeck
extra_scripts = merge-bin.py
  post:capture_layout.py
build_unflags = -D LORA_FREQ=869.618
  -D SX126X_DIO2_AS_RF_SWITCH=false
build_flags =
  ${LilyGo_TDeck.build_flags}
  -UDISPLAY_CLASS
  -I examples/meshdeck
  -I examples/meshdeck/ui
  -D MESHDECK=1
  -D MESHDECK_VERSION='"0.1.0_261115c"'
  ; T-Deck module uses DIO2 for its internal TX/RX RF switch (LilyGO/RadioLib
  ; default and Meshtastic board definition). Override upstream's false value.
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=32
  -D BLE_PIN_CODE=123456
  ; T-Deck Plus GPS UART support. Receiver model/baud must be verified. Compiled in
  ; but only polled when enabled in Settings -> GPS (default off, no module = no-op).
  -D ENV_INCLUDE_GPS=1
  -D ENV_SKIP_GPS_DETECT=1
  ; Default: Australia custom 923.125 MHz, BW 62.5, SF8, CR8.
  ; This only applies on a fresh flash; the first-boot onboarding lets the user
  ; pick an AU-compatible preset (other regions are rejected).
  -D LORA_FREQ=923.125
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  -<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/meshdeck/*.cpp>
  +<../examples/meshdeck/ui/*.cpp>
  +<../examples/meshdeck/ui/*.c>
lib_deps =
  SPI
  https://github.com/bitbank2/PNGdec/archive/64f9f3bc11cc1acb49f5bce823baae6ece910ba6.zip
  Wire
  Preferences
  adafruit/Adafruit AHTX0 @ 2.0.6
  adafruit/Adafruit BME280 Library @ 2.3.0
  adafruit/Adafruit BME680 Library @ 2.0.6
  adafruit/Adafruit BMP085 Library @ 1.2.4
  adafruit/Adafruit BMP280 Library @ 2.6.8
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/Adafruit GFX Library @ 1.13.0
  adafruit/Adafruit INA219 @ 1.2.3
  adafruit/Adafruit INA260 Library @ 1.5.4
  adafruit/Adafruit INA3221 Library @ 1.0.1
  adafruit/Adafruit MLX90614 Library @ 2.1.7
  adafruit/Adafruit NeoPixel @ 1.15.5
  adafruit/Adafruit seesaw Library @ 1.7.9
  adafruit/Adafruit SH110X @ 2.1.15
  adafruit/Adafruit SHTC3 Library @ 1.0.2
  adafruit/Adafruit SSD1306 @ 2.5.17
  adafruit/Adafruit ST7735 and ST7789 Library @ 1.12.0
  adafruit/Adafruit Unified Sensor @ 1.1.15
  adafruit/Adafruit_VL53L0X @ 1.2.5
  arduino-libraries/Arduino_LPS22HB @ 1.0.3
  bblanchon/ArduinoJson @ 7.4.3
  densaugeo/base64 @ 1.4.0
  electroniccats/CayenneLPP @ 1.6.1
  rweather/Crypto @ 0.4.0
  robtillaart/INA226 @ 0.6.6
  melopero/Melopero RV3028 @ 1.2.0
  stevemarple/MicroNMEA @ 2.0.6
  jgromes/RadioLib @ 7.8.1
  adafruit/RTClib @ 2.1.4
  sensirion/Sensirion Core @ 0.7.3
  sensirion/Sensirion I2C SHT4x @ 1.1.2
  throwtheswitch/Unity @ 2.6.1

[env:MeshCore_Enhanced_TDeck_Plus_GPS9600]
extends = env:MeshCore_Enhanced_TDeck_Plus
build_unflags = ${env:MeshCore_Enhanced_TDeck_Plus.build_unflags} -D GPS_BAUD_RATE=38400
build_flags = ${env:MeshCore_Enhanced_TDeck_Plus.build_flags}
  -D GPS_BAUD_RATE=9600
